name: ${COMPOSE_PROJECT_NAME:-githubactionslesson}

services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: github-actions-lesson-app:1.0.0
    ports:
      - "127.0.0.1:${APP_PORT:-8082}:8080"
    environment:
      HTTP_PORT: "8080"
      STATIC_DIR: /app/static
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/app", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks: [app_net]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    networks: [app_net]

volumes:
  db_data:

networks:
  app_net:
    driver: bridge
