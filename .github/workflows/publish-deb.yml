name: Build and publish syspulse Debian package to Nexus
on:
  push:
    branches: [release]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: syspulse-practice5-publish
  cancel-in-progress: false
jobs:
  build-publish-verify:
    runs-on: [self-hosted, macOS, ARM64, github-actions-lesson]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
      NEXUS_USER: ${{ secrets.NEXUS_USER }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare self-hosted tools
        run: |
          echo "$HOME/.cache/codex-runtimes/codex-primary-runtime/dependencies/python/bin" >> "$GITHUB_PATH"
          echo '/Applications/Docker.app/Contents/Resources/bin' >> "$GITHUB_PATH"
          /Applications/Docker.app/Contents/Resources/bin/docker info --format 'Docker {{.ServerVersion}}'
      - name: Prepare Go dpkg and curl container
        run: python3 scripts/package_ci.py tools
      - name: Create private publication configuration
        run: python3 scripts/package_ci.py configure
      - name: Build static Linux amd64 binary
        run: python3 scripts/package_ci.py build
      - name: Package Debian file using version from main.go
        id: pack
        run: python3 scripts/package_ci.py package
      - name: Publish Debian package to hosted APT
        run: python3 scripts/package_ci.py publish
      - name: Install through signed APT in clean Ubuntu
        run: python3 scripts/package_ci.py verify
      - name: Collect and audit publication evidence
        id: evidence
        if: always()
        run: python3 scripts/package_ci.py collect
      - name: Save Debian package and verification as artifact
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: syspulse-deb-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/
            package-artifacts/
          retention-days: 7
          if-no-files-found: error
      - name: Remove temporary publication credentials
        if: always()
        run: python3 scripts/package_ci.py cleanup
