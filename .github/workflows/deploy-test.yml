name: Docker Compose deployment and browser tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-actions-lesson-deploy
  cancel-in-progress: false

jobs:
  deploy-and-test:
    runs-on: [self-hosted, macOS, ARM64, github-actions-lesson]
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_PROJECT_NAME: githubactionslesson
      CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Check Docker Desktop
        run: |
          echo '/Applications/Docker.app/Contents/Resources/bin' >> "$GITHUB_PATH"
          export PATH="/Applications/Docker.app/Contents/Resources/bin:$PATH"
          docker info --format 'Docker server {{.ServerVersion}}; architecture {{.Architecture}}'
          docker compose version

      - name: Create environment file from GitHub Secrets
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          APP_PORT: ${{ secrets.APP_PORT }}
        run: python3 scripts/ci.py create-env

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install chromium

      - name: Build and start Docker Compose services
        run: |
          docker compose config -q
          docker compose up -d --build --wait --wait-timeout 120
          docker compose ps

      - name: Compare PostgreSQL, API and browser table
        env:
          APP_PORT: ${{ secrets.APP_PORT }}
        run: npm test

      - name: Collect logs and masked environment
        id: evidence
        if: always()
        run: python3 scripts/ci.py collect

      - name: Upload deployment evidence
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Write workflow summary
        if: always()
        run: |
          python3 scripts/ci.py summary
          cat artifacts/test-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Remove local secrets file
        if: always()
        run: python3 scripts/ci.py clean-env
